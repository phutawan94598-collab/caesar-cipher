<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Caesar Cipher Online</title>

    <!-- ส่วนตกแต่งเว็บ (CSS) -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ea9966, #764ba2);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: #ffffff;
            padding: 25px;
            width: 400px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
            color: #333;
        }

        label {
            font-weight: bold;
            margin-top: 10px;
            display: block;
        }

        textarea, input {
            width: 100%;
            margin-top: 5px;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #ccc;
            box-sizing: border-box;
            resize: none;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            color: white;
        }

        .encrypt {
            background: #4CAF50;
        }

        .decrypt {
            background: #f44336;
        }

        footer {
            text-align: center;
            margin-top: 15px;
            font-size: 12px;
            color: #666;
        }
            .container {
            margin: 20px;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>🔐 Caesar Cipher</h2>

    <label>ข้อความ</label>
    <textarea id="text1" rows="4"></textarea>

    <label>Key (จำนวนการเลื่อน)</label>
    <input type="number" id="key" value="0" min="0">

    <div class="buttons">
        <button class="encrypt" onclick="encrypt()">เข้ารหัส</button>
        <button class="decrypt" onclick="decrypt()">ถอดรหัส</button>
    </div>

    <label>ผลลัพธ์</label>
    <textarea id="result1" rows="4" readonly></textarea>

    <footer>
        Caesar Cipher | HTML & JavaScript
    </footer>
</div>

<div class="container">
    <h2>🔐 Number Cipher</h2>

    <label>ข้อความ</label>
    <textarea id="text2" rows="4"></textarea>
    <label>Length Key (จำนวนตัวอักษร)</label>
    <input type="number" id="lenKey" min="0" value="0">


    <div class="buttons">
        <button class="encrypt" onclick="numberEncrypt()">เข้ารหัส</button>
        <button class="decrypt" onclick="numberDecrypt()">ถอดรหัส</button>
    </div>

    <label>ผลลัพธ์</label>
    <textarea id="result2" rows="4" readonly></textarea>

    <footer>
        Number Cipher | HTML & JavaScript
    </footer>
</div>

<!-- ส่วนการทำงาน (JavaScript) -->
<script>
    function numberEncrypt() {
    let text = document.getElementById("text2").value;
    let lenBox = document.getElementById("lenKey");
    let result = [];

    for (let i = 0; i < text.length; i++) {
        let c = text[i];

        if ((c >= 'A' && c <= 'Z') || (c >= 'a' && c <= 'z')) {
            result.push(c.toUpperCase().charCodeAt(0) - 64);
        } else {
            result.push("0" + c.charCodeAt(0));
        }
    }

    // ใส่ Length Key
    lenBox.value = text.length;

    // แสดงเฉพาะตัวเลขเข้ารหัส
    document.getElementById("result2").value = result.join("-");
}

    function numberDecrypt() {
    let cipher = document.getElementById("text2").value;
    let lenKey = parseInt(document.getElementById("lenKey").value);

    let parts = cipher.split("-");
    let result = "";

    for (let i = 0; i < parts.length; i++) {
        let p = parts[i];

        if (p.startsWith("0")) {
            result += String.fromCharCode(parseInt(p.substring(1)));
        } else {
            let num = parseInt(p);
            if (num >= 1 && num <= 26) {
                result += String.fromCharCode(num + 64);
            }
        }
    }

    // ตรวจ Length Key
    if (!isNaN(lenKey) && result.length !== lenKey) {
        alert("❌ Length Key ไม่ตรง ข้อมูลถูกแก้ไขหรือหาย");
        return;
    }

    document.getElementById("result2").value = result;
}

function encrypt() {
    let text = document.getElementById("text1").value;
    let key = parseInt(document.getElementById("key").value);
    document.getElementById("result1").value = caesar(text, key);
}

function decrypt() {
    let text = document.getElementById("text1").value;
    let key = parseInt(document.getElementById("key").value);
    document.getElementById("result1").value = caesar(text, -key);
}

function caesar(str, shift) {
    let result = "";

    for (let i = 0; i < str.length; i++) {
        let code = str.charCodeAt(i);

        if (code >= 65 && code <= 90) {
            result += String.fromCharCode((code - 65 + shift + 26) % 26 + 65);
        } 
        else if (code >= 97 && code <= 122) {
            result += String.fromCharCode((code - 97 + shift + 26) % 26 + 97);
        } 
        else {
            result += str[i];
        }
    }
    return result;
}
</script>

</body>
</html>
